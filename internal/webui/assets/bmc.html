<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="metalkit-api-base" content="/api/v1">
  <title>metalkit - BMC 凭据</title>
  <link rel="stylesheet" href="/ui/assets/style.css">
</head>
<body data-page="bmc">
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="brand"><a href="/ui/">metalkit</a></h1>
      <nav class="topnav">
        <a href="/ui/">机器</a>
        <a href="/ui/images">镜像</a>
        <a href="/ui/subnets">子网</a>
        <a href="/ui/profiles">配置</a>
        <a href="/ui/bmc">BMC</a>
        <a href="/ui/jobs">作业</a>
      </nav>
      <div class="topbar-actions">
        <button id="new-bmc-btn" type="button" class="btn btn-primary">+ 新建 BMC</button>
        <button id="import-bmc-btn" type="button" class="btn">批量导入 CSV</button>
        <button id="refresh-btn" type="button" class="btn">刷新</button>
        <span id="current-user" class="muted" title="当前登录用户"></span>
        <button id="logout-btn" type="button" class="btn btn-ghost" title="退出登录">退出</button>
      </div>
    </div>
  </header>
  <main class="page">
    <div id="error-banner" class="error-banner" hidden></div>
    <section>
      <div class="section-head">
        <h2>BMC 凭据</h2>
        <span id="bmc-count" class="muted"></span>
      </div>
      <div id="bmc-loading" class="muted">加载中&hellip;</div>
      <div id="bmc-empty" class="empty-state" hidden>
        <p>尚未登记任何 BMC 凭据。</p>
        <p class="muted">点击 <strong>+ 新建 BMC</strong> 给某台机器关联凭据。</p>
      </div>
      <div id="bmc-wrap" hidden>
        <table id="bmc-table" class="data-table">
          <thead>
            <tr>
              <th>名称</th>
              <th>机器</th>
              <th>IP : 端口</th>
              <th>用户名</th>
              <th>接口</th>
              <th>更新时间</th>
              <th class="col-actions">操作</th>
            </tr>
          </thead>
          <tbody id="bmc-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer class="footer"><span class="muted">metalkit 运维控制台</span></footer>
  <script src="/ui/assets/common.js" defer></script>
  <script src="/ui/assets/bmc.js" defer></script>
</body>
</html>
